<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3AMjogar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: url('bg.jpg') center center / cover no-repeat fixed,
                  linear-gradient(135deg, #0a0e1a 0%, #1a2a4a 50%, #4a8ec4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 25, 0.5);
      z-index: 0;
    }

    /* Relámpago ocasional */
    .lightning {
      position: fixed;
      inset: 0;
      background: rgba(180, 220, 255, 0.15);
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      animation: lightning 9s infinite;
    }

    @keyframes lightning {
      0%, 100% { opacity: 0; }
      5%  { opacity: 1; }
      6%  { opacity: 0; }
      7%  { opacity: 0.7; }
      8%  { opacity: 0; }
      60% { opacity: 0; }
      61% { opacity: 0.5; }
      62% { opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Avatar — foto o emoji */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(100, 180, 255, 0.6);
      box-shadow: 0 0 0 6px rgba(100, 180, 255, 0.1),
                  0 0 40px rgba(80, 160, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: linear-gradient(135deg, #1e3a5f, #2d5a8e);
      animation: pulse 3s ease-in-out infinite;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(100,180,255,0.1), 0 0 40px rgba(80,160,255,0.4); }
      50%       { box-shadow: 0 0 0 10px rgba(100,180,255,0.05), 0 0 60px rgba(80,160,255,0.6); }
    }

    h1 {
      color: #e8f4ff;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(100, 180, 255, 0.7), 0 0 40px rgba(60,140,255,0.3);
    }

    .tagline {
      color: rgba(160, 210, 255, 0.65);
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -8px;
    }

    /* Contador de visitas */
    .visits {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(100,180,255,0.15);
      border-radius: 20px;
      padding: 5px 14px;
      color: rgba(160, 210, 255, 0.6);
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .visits span { color: rgba(180,220,255,0.9); font-weight: 600; }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #e8f4ff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(100, 180, 255, 0.18);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      animation: fadeUp 0.7s ease both;
    }

    .btn:nth-child(1) { animation-delay: 0.1s; }
    .btn:nth-child(2) { animation-delay: 0.2s; }
    .btn:nth-child(3) { animation-delay: 0.3s; }
    .btn:nth-child(4) { animation-delay: 0.4s; }
    .btn:nth-child(5) { animation-delay: 0.5s; }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(100, 180, 255, 0.55);
      background: rgba(100, 180, 255, 0.1);
      box-shadow: 0 10px 35px rgba(60, 140, 255, 0.25);
      color: #fff;
    }

    .btn:active { transform: translateY(0) scale(0.98); }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .btn:hover .icon { transform: scale(1.1) rotate(-5deg); }

    .icon-yt { background: #ff0000; }
    .icon-ig { background: linear-gradient(135deg, #833ab4, #fd1d1d, #f77737); }
    .icon-tt { background: #010101; border: 1px solid rgba(255,255,255,0.15); }
    .icon-fb { background: #1877f2; }
    .icon-wa { background: #25d366; }

    .icon img { width: 22px; height: 22px; object-fit: contain; filter: brightness(0) invert(1); }

    .btn-label { flex: 1; }

    .arrow {
      color: rgba(100, 180, 255, 0.35);
      font-size: 1rem;
      transition: transform 0.2s, color 0.2s;
    }
    .btn:hover .arrow { transform: translateX(5px); color: rgba(100,180,255,0.9); }

    .footer {
      margin-top: 8px;
      color: rgba(100, 160, 220, 0.3);
      font-size: 0.7rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="lightning"></div>

  <div class="container">
    <div class="avatar">
      <img src="avatar.jpg" onerror="this.parentElement.innerHTML='🌩️'" alt="3AMjogar">
    </div>

    <h1>3AMjogar</h1>
    <p class="tagline">content creator</p>

    <div class="visits">
      👁 Visitas: <span id="cnt">—</span>
    </div>

    <div class="links">
      <a class="btn" href="http://www.youtube.com/@Jogarluvsu" target="_blank" rel="noopener">
        <div class="icon icon-yt"><img src="https://cdn.simpleicons.org/youtube/white" alt="YouTube"></div>
        <span class="btn-label">YouTube</span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://www.instagram.com/jogar3am/" target="_blank" rel="noopener">
        <div class="icon icon-ig"><img src="https://cdn.simpleicons.org/instagram/white" alt="Instagram"></div>
        <span class="btn-label">Instagram</span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://www.tiktok.com/@3amjogar" target="_blank" rel="noopener">
        <div class="icon icon-tt"><img src="https://cdn.simpleicons.org/tiktok/white" alt="TikTok"></div>
        <span class="btn-label">TikTok</span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://www.facebook.com/profile.php?id=61557603957557" target="_blank" rel="noopener">
        <div class="icon icon-fb"><img src="https://cdn.simpleicons.org/facebook/white" alt="Facebook"></div>
        <span class="btn-label">Facebook</span>
        <span class="arrow">›</span>
      </a>

      <a class="btn" href="https://wa.me/16028217262" target="_blank" rel="noopener">
        <div class="icon icon-wa"><img src="https://cdn.simpleicons.org/whatsapp/white" alt="WhatsApp"></div>
        <span class="btn-label">WhatsApp</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <p class="footer">3amjogar © 2026</p>
  </div>

  <script>
    // Contador de visitas usando localStorage
    const key = '3amjogar_visits';
    const visits = parseInt(localStorage.getItem(key) || '0') + 1;
    localStorage.setItem(key, visits);
    document.getElementById('cnt').textContent = visits.toLocaleString();
  </script>
</body>
</html>
