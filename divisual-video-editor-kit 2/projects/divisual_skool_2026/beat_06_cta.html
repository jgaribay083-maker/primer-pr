<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 06 — CTA Comenta «tribu»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 2160px; height: 3840px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .card {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    padding: 50px 60px 60px;
    background: rgba(13, 13, 13, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 3px solid #FAC51C;
    border-radius: 40px;
    box-shadow: 0 30px 110px rgba(0, 0, 0, 0.75), 0 0 90px rgba(250, 197, 28, 0.20);
    text-align: center;
    opacity: 0;
  }
  .pre {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 50px;
    letter-spacing: 4px;
    color: #FFFFFF;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .tribu {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 250px;
    line-height: 1;
    letter-spacing: -6px;
    color: #FAC51C;
    text-shadow: 0 0 80px rgba(250, 197, 28, 0.65);
    opacity: 0;
    transform: scale(0.6);
  }
  .quotes { font-family: 'Space Grotesk', sans-serif; font-weight: 700; opacity: 0.45; }
  .arrow {
    margin-top: 20px;
    font-size: 78px;
    color: #FAC51C;
    opacity: 0;
  }
  .footer {
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 48px;
    color: #B0B0B0;
    letter-spacing: 1px;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="pre">COMENTA LA PALABRA</div>
    <div class="tribu" id="tribu"><span class="quotes">«</span>tribu<span class="quotes">»</span></div>
    <div class="arrow" id="arrow">↓</div>
    <div class="footer" id="footer">y te envío el acceso directo</div>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#card',
    { opacity: 0, y: 100 },
    { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' }, 0.10);
  // «tribu» popIn at out_t 47.58 → beat-rel 47.58 - 46.30 = 1.28s
  tl.fromTo('#tribu',
    { opacity: 0, scale: 0.6 },
    { opacity: 1, scale: 1, duration: 0.50, ease: 'back.out(2.6)' }, 1.28);
  tl.fromTo('#arrow',
    { opacity: 0, y: -16 },
    { opacity: 0.8, y: 0, duration: 0.30, ease: 'power2.out' }, 1.78);
  tl.fromTo('#footer',
    { opacity: 0, y: 16 },
    { opacity: 1, y: 0, duration: 0.30, ease: 'power2.out' }, 1.95);
  tl.to('#card', { opacity: 0, y: -40, duration: 0.45, ease: 'power2.in' }, 3.75);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
