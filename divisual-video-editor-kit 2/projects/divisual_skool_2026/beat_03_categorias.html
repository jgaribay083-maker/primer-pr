<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beat 03 — Categorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent !important; width: 2160px; height: 3840px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
  .card {
    position: absolute;
    top: 220px;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    padding: 64px 80px;
    background: rgba(13, 13, 13, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(250, 197, 28, 0.22);
    border-radius: 38px;
    box-shadow: 0 28px 90px rgba(0, 0, 0, 0.65);
    opacity: 0;
  }
  .label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 50px;
    letter-spacing: 6px;
    color: #FAC51C;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 50px;
  }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 36px;
    padding: 26px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    opacity: 0;
    transform: translateY(20px);
  }
  li:last-child { border-bottom: none; }
  .check {
    flex: 0 0 auto;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #FAC51C;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 36px rgba(250, 197, 28, 0.55);
  }
  .check svg { width: 50px; height: 50px; }
  .text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 92px;
    letter-spacing: -1px;
    line-height: 1.05;
    color: #FFFFFF;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="label">Áreas de la Tribu</div>
    <ul>
      <li id="li1">
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0D0D0D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="text">Inteligencia Artificial</div>
      </li>
      <li id="li2">
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0D0D0D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="text">Marketing</div>
      </li>
      <li id="li3">
        <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0D0D0D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="text">Negocios Digitales</div>
      </li>
    </ul>
  </div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#card',
    { opacity: 0, y: 80 },
    { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 0.10);
  // Items synced to speech (beat starts at out_t 8.50)
  // "inteligencia artificial" at 8.95 → 0.45s
  // "marketing" at 10.03 → 1.53s
  // "negocios digitales" at 10.55 → 2.05s
  tl.fromTo('#li1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 0.45);
  tl.fromTo('#li2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 1.53);
  tl.fromTo('#li3', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.30, ease: 'power3.out' }, 2.05);
  tl.to('#card', { opacity: 0, y: -40, duration: 0.45, ease: 'power2.in' }, 5.05);
  window.__timelines = { main: tl };
  tl.play();
</script>
</body>
</html>
